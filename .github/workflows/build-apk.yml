name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor v6
        run: |
          npm install
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Web Application (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://rugjqcvwlfkonziykita.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8' }}
          VITE_WORKER_URL: 'https://jkt48-live-watcher.chandra02new.workers.dev'
          VITE_GITHUB_REPO: 'Chandraaa20/jkt48-live-recorder'
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8984988206:AAFdz-53vl5FHckci1tmSoxMSSBVhRwhVrY' }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1004410575074' }}
        run: npm run build

      - name: Generate & Sync Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions & Cleartext Traffic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Configuring AndroidManifest.xml..."
            
            # Add Internet permission if missing
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
            
            # Add Notification permission if missing
            if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            fi

            # Enable cleartext HTTP traffic for HLS stream playback compatibility
            if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
            fi
            
            cat "$MANIFEST" | head -n 35
          else
            echo "Warning: $MANIFEST not found"
          fi

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify Generated APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK successfully created at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "Error: APK not found at $APK_PATH"
            find android/app/build -name "*.apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JKT48-Live-Recorder-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
