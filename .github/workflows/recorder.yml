name: JKT48 Cloud Recorder

on:
  repository_dispatch:
    types: [start_recording]
  workflow_dispatch:
    inputs:
      recording_id:
        description: 'Recording ID (UUID from recordings table)'
        required: true
        default: 'test-recording-id'
      member_name:
        description: 'JKT48 Member Name'
        required: true
        default: 'Freya Jayawardana'
      platform:
        description: 'Live Platform (idn / showroom)'
        required: true
        default: 'idn'
      stream_url:
        description: 'Stream URL (.m3u8)'
        required: true
        default: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'

      duration:
        description: 'Duration in seconds (0 for indefinite live recording)'
        required: false
        default: '0'

jobs:
  record:
    name: Record and Archive Live Stream
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Up to 6 hours max live recording

    # Local Telegram Bot API Server enabling full 2000MB (2GB) direct file uploads
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '6' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}
          TELEGRAM_LOCAL: "1"
        ports:
          - 8081:8081

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup WARP Egress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl jq bc python3-pip
          pip install --break-system-packages streamlink yt-dlp || true

          # Install Cloudflare WARP client for Anycast egress IP
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg || true
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list || true
          sudo apt-get update -qq && sudo apt-get install -y cloudflare-warp || true
          sudo systemctl start warp-svc || true
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 2
          curl -s --connect-timeout 4 --socks5 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace || true

      - name: Extract Input Parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RECORDING_ID=${{ github.event.inputs.recording_id }}" >> $GITHUB_ENV
            echo "MEMBER_NAME=${{ github.event.inputs.member_name }}" >> $GITHUB_ENV
            echo "PLATFORM=${{ github.event.inputs.platform }}" >> $GITHUB_ENV
            echo "STREAM_URL=${{ github.event.inputs.stream_url }}" >> $GITHUB_ENV
            echo "DURATION=${{ github.event.inputs.duration || '0' }}" >> $GITHUB_ENV
          else
            echo "RECORDING_ID=${{ github.event.client_payload.recording_id }}" >> $GITHUB_ENV
            echo "MEMBER_NAME=${{ github.event.client_payload.member_name }}" >> $GITHUB_ENV
            echo "PLATFORM=${{ github.event.client_payload.platform }}" >> $GITHUB_ENV
            echo "STREAM_URL=${{ github.event.client_payload.stream_url }}" >> $GITHUB_ENV
            echo "DURATION=${{ github.event.client_payload.duration || '0' }}" >> $GITHUB_ENV
          fi

      - name: Notify Recording Started (Supabase)
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://rugjqcvwlfkonziykita.supabase.co"
          fi
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8"
          fi

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Updating recording status to 'recording' in Supabase..."
            curl -s -X PATCH "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"status":"recording"}' || true
          fi

      - name: Capture Live Stream (Crash-Proof Transport Stream .ts Segmenter)
        id: record_step
        run: |
          echo "Starting recording for $MEMBER_NAME ($PLATFORM)..."
          echo "Stream URL: $STREAM_URL"
          echo "Duration Limit: ${DURATION:-0}s (0 = indefinite)"
          
          SAFE_NAME=$(echo "$MEMBER_NAME" | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BASE_PREFIX="${SAFE_NAME}_${PLATFORM}_${TIMESTAMP}"
          echo "BASE_PREFIX=$BASE_PREFIX" >> $GITHUB_ENV

          mkdir -p raw_segments

          REC_DUR="${DURATION:-45}"
          if [ "$REC_DUR" -eq 0 ] 2>/dev/null; then
            REC_DUR=45
          fi

          if [ "$PLATFORM" = "idn" ]; then
            echo "IDN Live recording via Cloudflare Worker Proxy & Python Engine..."
            ENCODED_STREAM=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$STREAM_URL")
            PROXY_MASTER="https://jkt48-live-watcher.chandra02new.workers.dev/api/proxy/stream.m3u8?url=${ENCODED_STREAM}"

            # Strategy 1: Python Engine via Cloudflare Worker Proxy (with SOCKS5 WARP egress)
            echo "Strategy 1: Python Engine via Cloudflare Worker Proxy (WARP)..."
            python scripts/capture_hls.py "$PROXY_MASTER" "raw_segments/rec_part_000.ts" "$REC_DUR" "$RECORDING_ID" "$SUPABASE_URL" "$SUPABASE_KEY" "127.0.0.1" "40000" || true

            # Strategy 2: Python Engine via Cloudflare Worker Proxy Direct
            if [ ! -s "raw_segments/rec_part_000.ts" ]; then
              echo "Strategy 2: Python Engine via Cloudflare Worker Proxy Direct..."
              python scripts/capture_hls.py "$PROXY_MASTER" "raw_segments/rec_part_000.ts" "$REC_DUR" "$RECORDING_ID" "$SUPABASE_URL" "$SUPABASE_KEY" || true
            fi

            # Strategy 3: streamlink via Cloudflare Worker Proxy
            if [ ! -s "raw_segments/rec_part_000.ts" ]; then
              echo "Strategy 3: streamlink via Cloudflare Worker Proxy..."
              timeout "${REC_DUR}s" streamlink --hls-live-restart \
                --http-header "Origin=https://www.idn.app" \
                --http-header "Referer=https://www.idn.app/" \
                --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                "$PROXY_MASTER" best -o "raw_segments/rec_part_000.ts" || true
            fi

            # Strategy 4: yt-dlp via Cloudflare Worker Proxy
            if [ ! -s "raw_segments/rec_part_000.ts" ]; then
              echo "Strategy 4: yt-dlp via Cloudflare Worker Proxy..."
              timeout "${REC_DUR}s" yt-dlp \
                --add-header "Origin:https://www.idn.app" \
                --add-header "Referer:https://www.idn.app/" \
                --hls-use-mpegts \
                -o "raw_segments/rec_part_000.ts" "$PROXY_MASTER" || true
            fi
          else
            # Showroom recording
            echo "Showroom recording via Python Engine / streamlink / FFmpeg..."
            python scripts/capture_hls.py "$STREAM_URL" "raw_segments/rec_part_000.ts" "$REC_DUR" "$RECORDING_ID" "$SUPABASE_URL" "$SUPABASE_KEY" || \
            timeout "${REC_DUR}s" streamlink "$STREAM_URL" best -o "raw_segments/rec_part_000.ts" || \
            ffmpeg -hide_banner -loglevel warning \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -i "$STREAM_URL" \
              -c copy \
              -t "$REC_DUR" \
              "raw_segments/rec_part_000.ts" || true
          fi

          echo "Recording step completed."

      - name: Remux and Consolidate Video Segments
        if: always()
        run: |
          mkdir -p processed_videos
          shopt -s nullglob
          TS_FILES=(raw_segments/*.ts)
          VALID_TS=()

          for f in "${TS_FILES[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              VALID_TS+=("$f")
            fi
          done

          TOTAL_COUNT=${#VALID_TS[@]}
          echo "Found $TOTAL_COUNT valid .ts recording segments"

          if [ "$TOTAL_COUNT" -eq 0 ]; then
            echo "No video data captured (live offline or stream unavailable)."
            echo "HAS_VIDEO=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "HAS_VIDEO=true" >> $GITHUB_ENV

          TOTAL_BYTES=0
          TOTAL_DURATION=0
          PART_IDX=1

          for ts in "${VALID_TS[@]}"; do
            MP4_NAME="processed_videos/${BASE_PREFIX}_part$(printf "%02d" $PART_IDX).mp4"
            echo "Remuxing $ts to $MP4_NAME with faststart..."
            
            ffmpeg -hide_banner -loglevel error -i "$ts" -c copy -movflags +faststart "$MP4_NAME" || cp "$ts" "processed_videos/${BASE_PREFIX}_part$(printf "%02d" $PART_IDX).ts"
            
            TARGET_FILE="$MP4_NAME"
            if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
              TARGET_FILE="processed_videos/${BASE_PREFIX}_part$(printf "%02d" $PART_IDX).ts"
            fi

            FILE_SZ=$(stat -c%s "$TARGET_FILE")
            TOTAL_BYTES=$((TOTAL_BYTES + FILE_SZ))
            
            DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$TARGET_FILE" 2>/dev/null | cut -d'.' -f1)
            if [ -n "$DUR" ] && [ "$DUR" -gt 0 ] 2>/dev/null; then
              TOTAL_DURATION=$((TOTAL_DURATION + DUR))
            else
              TOTAL_DURATION=$((TOTAL_DURATION + 60))
            fi
            PART_IDX=$((PART_IDX + 1))
          done

          FILE_MB=$(awk "BEGIN {printf \"%.2f\", $TOTAL_BYTES / 1048576}")
          echo "TOTAL_DURATION=$TOTAL_DURATION" >> $GITHUB_ENV
          echo "FILE_SIZE_MB=$FILE_MB" >> $GITHUB_ENV
          echo "Consolidation complete: ${TOTAL_COUNT} part(s), ${TOTAL_DURATION}s duration, ${FILE_MB}MB total."

      - name: Upload Video to Telegram (Always Guaranteed Upload)
        id: upload_telegram
        if: always()
        run: |
          if [ "$HAS_VIDEO" != "true" ]; then
            echo "Skipping Telegram upload: No recorded video file exists."
            echo "TELEGRAM_LINK=" >> $GITHUB_ENV
            exit 0
          fi

          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          if [ -z "$BOT_TOKEN" ]; then
            BOT_TOKEN="8984988206:AAEpkoy-TRN6HGg0Uk_MI67Pon7gJiucEuU"
          fi

          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -z "$CHAT_ID" ]; then
            CHAT_ID="-1004418157265"
          fi

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or CHAT_ID missing."
            echo "TELEGRAM_LINK=" >> $GITHUB_ENV
            exit 0
          fi

          # Detect if local bot API server on 8081 is active
          LOCAL_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081 || echo "000")
          if [ "$LOCAL_HEALTH" = "404" ] || [ "$LOCAL_HEALTH" = "200" ]; then
            echo "Using Local Bot API Server on port 8081 (supports up to 2000MB per file)"
            TELEGRAM_API_URL="http://localhost:8081/bot${BOT_TOKEN}"
            MAX_UPLOAD_BYTES=2000000000
          else
            echo "Local Bot API unavailable, using standard api.telegram.org (49MB limit)"
            TELEGRAM_API_URL="https://api.telegram.org/bot${BOT_TOKEN}"
            MAX_UPLOAD_BYTES=49000000
          fi

          shopt -s nullglob
          VIDEO_FILES=(processed_videos/*)
          TOTAL_FILES=${#VIDEO_FILES[@]}
          echo "Total video files to upload: $TOTAL_FILES"

          LAST_MSG_LINK=""
          CURR_NUM=1

          for vid in "${VIDEO_FILES[@]}"; do
            VID_BYTES=$(stat -c%s "$vid")
            VID_MB=$(awk "BEGIN {printf \"%.2f\", $VID_BYTES / 1048576}")
            CAPTION="🎬 <b>${MEMBER_NAME} - Live Recording</b>%0A📱 Platform: <b>${PLATFORM^^}</b>%0A📦 <b>Part ${CURR_NUM}/${TOTAL_FILES}</b> (${VID_MB} MB)%0A⏱️ Durasi: <b>${TOTAL_DURATION} detik</b>%0A📅 $(date '+%d %B %Y - %H:%M WIB')"

            # If within single file upload limit
            if [ "$VID_BYTES" -le "$MAX_UPLOAD_BYTES" ]; then
              echo "Uploading $vid (${VID_MB} MB) directly..."
              RESPONSE=$(curl -s -F "chat_id=${CHAT_ID}" \
                -F "video=@${vid}" \
                -F "caption=${CAPTION}" \
                -F "parse_mode=HTML" \
                -F "supports_streaming=true" \
                "${TELEGRAM_API_URL}/sendVideo")

              IS_OK=$(echo "$RESPONSE" | jq -r '.ok')
              if [ "$IS_OK" = "true" ]; then
                MSG_ID=$(echo "$RESPONSE" | jq -r '.result.message_id')
                if [[ "$CHAT_ID" =~ ^-100 ]]; then
                  CLEAN_CHAT=$(echo "$CHAT_ID" | sed 's/^-100//')
                  LAST_MSG_LINK="https://t.me/c/${CLEAN_CHAT}/${MSG_ID}"
                else
                  LAST_MSG_LINK="https://t.me/${CHAT_ID}/${MSG_ID}"
                fi
                echo "Part $CURR_NUM uploaded successfully: $LAST_MSG_LINK"
              else
                echo "Telegram sendVideo error: $RESPONSE"
              fi
            else
              # Exceeds limit -> split into 45MB chunks
              echo "File $vid exceeds $MAX_UPLOAD_BYTES bytes. Auto-splitting..."
              mkdir -p subparts
              ffmpeg -i "$vid" -c copy -map 0 -f segment -segment_time 600 -reset_timestamps 1 subparts/sub_%03d.mp4
              SUB_FILES=(subparts/*.mp4)
              SUB_TOTAL=${#SUB_FILES[@]}
              SUB_NUM=1
              for s in "${SUB_FILES[@]}"; do
                SUB_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s "$s") / 1048576}")
                SUB_CAPTION="${CAPTION}%0A🔹 <i>Sub-part ${SUB_NUM}/${SUB_TOTAL}</i> (${SUB_MB} MB)"
                RESP=$(curl -s -F "chat_id=${CHAT_ID}" \
                  -F "video=@${s}" \
                  -F "caption=${SUB_CAPTION}" \
                  -F "parse_mode=HTML" \
                  -F "supports_streaming=true" \
                  "${TELEGRAM_API_URL}/sendVideo")
                SUB_NUM=$((SUB_NUM + 1))
                sleep 1
              done
              rm -rf subparts
            fi

            CURR_NUM=$((CURR_NUM + 1))
            sleep 1
          done

          echo "TELEGRAM_LINK=$LAST_MSG_LINK" >> $GITHUB_ENV

      - name: Sync Final Status to Supabase
        if: always()
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://rugjqcvwlfkonziykita.supabase.co"
          fi

          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8"
          fi

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Supabase not configured."
            exit 0
          fi

          # Only mark completed if video was captured, size is > 0, and duration is > 0
          IS_VALID_RECORDING=false
          if [ "$HAS_VIDEO" = "true" ] && [ -n "$FILE_SIZE_MB" ]; then
            IS_POSITIVE=$(awk "BEGIN {print ($FILE_SIZE_MB > 0.05) ? 1 : 0}")
            if [ "$IS_POSITIVE" -eq 1 ] && [ "${TOTAL_DURATION:-0}" -gt 0 ]; then
              IS_VALID_RECORDING=true
            fi
          fi

          if [ "$IS_VALID_RECORDING" = "true" ]; then
            echo "Marking recording as completed in Supabase (${FILE_SIZE_MB} MB, ${TOTAL_DURATION}s)..."
            FINAL_URL="${TELEGRAM_LINK:-https://t.me}"
            curl -s -X PATCH "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"completed\",\"video_url\":\"${FINAL_URL}\",\"duration_seconds\":${TOTAL_DURATION},\"file_size_mb\":${FILE_SIZE_MB}}" || true
          else
            echo "Recording is 0 MB or stream was unavailable. Deleting recording ${RECORDING_ID} from Supabase to prevent 0 MB garbage..."
            curl -s -X DELETE "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" || true
          fi
