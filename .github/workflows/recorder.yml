name: JKT48 Cloud Recorder

on:
  repository_dispatch:
    types: [start_recording]
  workflow_dispatch:
    inputs:
      recording_id:
        description: 'Recording ID (UUID from recordings table)'
        required: true
        default: 'test-recording-id'
      member_name:
        description: 'JKT48 Member Name'
        required: true
        default: 'Freya Jayawardana'
      platform:
        description: 'Live Platform (idn / showroom)'
        required: true
        default: 'idn'
      stream_url:
        description: 'Stream URL (.m3u8)'
        required: true
        default: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'

      duration:
        description: 'Duration in seconds (0 for indefinite live recording)'
        required: false
        default: '0'

jobs:
  record:
    name: Record and Archive Live Stream
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Up to 6 hours max live recording
    env:
      TZ: Asia/Jakarta

    # Local Telegram Bot API Server enabling full 2000MB (2GB) direct file uploads
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_LOCAL: 1
        ports:
          - 8081:8081

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup WARP Egress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl jq bc python3-pip
          pip install --break-system-packages streamlink yt-dlp requests urllib3 || true

          # Install Cloudflare WARP client for Anycast egress IP
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg || true
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list || true
          sudo apt-get update -qq && sudo apt-get install -y cloudflare-warp || true
          sudo systemctl start warp-svc || true
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 2
          curl -s --connect-timeout 4 --socks5 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace || true

      - name: Extract Input Parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RECORDING_ID=${{ github.event.inputs.recording_id }}" >> $GITHUB_ENV
            echo "MEMBER_NAME=${{ github.event.inputs.member_name }}" >> $GITHUB_ENV
            echo "PLATFORM=${{ github.event.inputs.platform }}" >> $GITHUB_ENV
            echo "STREAM_URL=${{ github.event.inputs.stream_url }}" >> $GITHUB_ENV
            echo "DURATION=${{ github.event.inputs.duration || '0' }}" >> $GITHUB_ENV
          else
            echo "RECORDING_ID=${{ github.event.client_payload.recording_id }}" >> $GITHUB_ENV
            echo "MEMBER_NAME=${{ github.event.client_payload.member_name }}" >> $GITHUB_ENV
            echo "PLATFORM=${{ github.event.client_payload.platform }}" >> $GITHUB_ENV
            echo "STREAM_URL=${{ github.event.client_payload.stream_url }}" >> $GITHUB_ENV
            echo "DURATION=${{ github.event.client_payload.duration || '0' }}" >> $GITHUB_ENV
          fi

          START_TIME_WIB=$(TZ='Asia/Jakarta' date '+%d %b %Y, %H:%M WIB' | sed -e 's/Jan/Jan/' -e 's/Feb/Feb/' -e 's/Mar/Mar/' -e 's/Apr/Apr/' -e 's/May/Mei/' -e 's/Jun/Jun/' -e 's/Jul/Jul/' -e 's/Aug/Agt/' -e 's/Sep/Sep/' -e 's/Oct/Okt/' -e 's/Nov/Nov/' -e 's/Dec/Des/')
          echo "START_TIME_WIB=$START_TIME_WIB" >> $GITHUB_ENV
          echo "Recording start time: $START_TIME_WIB"

      - name: Notify Recording Started (Supabase)
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://rugjqcvwlfkonziykita.supabase.co"
          fi
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8"
          fi

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Updating recording status to 'recording' in Supabase..."
            curl -s -X PATCH "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"status":"recording"}' || true
            echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
            echo "SUPABASE_KEY=$SUPABASE_KEY" >> $GITHUB_ENV
          fi

      - name: Capture Live Stream (Crash-Proof Transport Stream .ts Segmenter)
        id: record_step
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rugjqcvwlfkonziykita.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8' }}
          RECORDING_ID: ${{ env.RECORDING_ID }}
        run: |
          echo "Starting recording for $MEMBER_NAME ($PLATFORM)..."
          echo "Stream URL: $STREAM_URL"
          echo "Duration Limit: ${DURATION:-0}s (0 = indefinite)"
          
          SAFE_NAME=$(echo "$MEMBER_NAME" | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BASE_PREFIX="${SAFE_NAME}_${PLATFORM}_${TIMESTAMP}"
          echo "BASE_PREFIX=$BASE_PREFIX" >> $GITHUB_ENV

          mkdir -p raw_segments

          # Zero is intentional: capture until the app changes the recording
          # status to uploading. Never convert a real live into 45-second clips.
          REC_DUR="${DURATION:-0}"

          echo "Executing Universal Split-Fetch HLS Capture Engine for $PLATFORM ($MEMBER_NAME)..."
          python3 -u scripts/capture_hls.py "$STREAM_URL" "raw_segments/rec_part_000.ts" "$REC_DUR" "$RECORDING_ID" "$SUPABASE_URL" "$SUPABASE_KEY" || true

          # Secondary Fallback: streamlink
          if [ ! -s "raw_segments/rec_part_000.ts" ]; then
            echo "Fallback: Trying streamlink direct..."
            FALLBACK_TIMEOUT="$REC_DUR"
            if [ "$FALLBACK_TIMEOUT" -eq 0 ] 2>/dev/null; then FALLBACK_TIMEOUT=21600; fi
            DURATION_ARGS=()
            if [ "$REC_DUR" -gt 0 ] 2>/dev/null; then DURATION_ARGS=(-t "$REC_DUR"); fi
            timeout "${FALLBACK_TIMEOUT}s" streamlink \
              --http-header "Origin=https://www.idn.app" \
              --http-header "Referer=https://www.idn.app/" \
              --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              "$STREAM_URL" best -o "raw_segments/rec_part_000.ts" || \
            ffmpeg -hide_banner -loglevel warning \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -i "$STREAM_URL" \
              -c copy \
              "${DURATION_ARGS[@]}" \
              "raw_segments/rec_part_000.ts" || true
          fi

          echo "Recording step completed."

      - name: Remux and Consolidate Video Segments
        if: always()
        run: |
          mkdir -p processed_videos
          shopt -s nullglob
          TS_FILES=(raw_segments/*.ts)
          VALID_TS=()

          for f in "${TS_FILES[@]}"; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              VALID_TS+=("$f")
            fi
          done

          TOTAL_COUNT=${#VALID_TS[@]}
          echo "Found $TOTAL_COUNT valid .ts recording segments"

          if [ "$TOTAL_COUNT" -eq 0 ]; then
            echo "No video data captured (live offline or stream unavailable)."
            echo "HAS_VIDEO=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "HAS_VIDEO=true" >> $GITHUB_ENV

          # Combine all segments into one master .ts stream (lossless MPEG-TS concatenation)
          if [ "$TOTAL_COUNT" -eq 1 ]; then
            COMBINED_TS="${VALID_TS[0]}"
          else
            echo "Concatenating $TOTAL_COUNT .ts segments into raw_segments/all_combined.ts..."
            cat "${VALID_TS[@]}" > raw_segments/all_combined.ts
            COMBINED_TS="raw_segments/all_combined.ts"
          fi

          # Remux to 100% original MP4 without re-encoding (-c copy -movflags +faststart)
          FULL_MP4="raw_segments/full_original.mp4"
          echo "Remuxing $COMBINED_TS to $FULL_MP4 (100% Original, -c copy -movflags +faststart)..."
          ffmpeg -hide_banner -loglevel error -y -i "$COMBINED_TS" -c copy -movflags +faststart "$FULL_MP4" || cp "$COMBINED_TS" "$FULL_MP4"

          TOTAL_BYTES=$(stat -c%s "$FULL_MP4")
          SPLIT_LIMIT_BYTES=2044723200 # 1950 MB (~1.95 GB, safely within 2000 MB Telegram Local Bot limit)

          TOTAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FULL_MP4" 2>/dev/null | cut -d'.' -f1)
          if [ -z "$TOTAL_DURATION" ] || [ "$TOTAL_DURATION" -le 0 ] 2>/dev/null; then
            TOTAL_DURATION=60
          fi

          # Aturan 1 Video Full (<= 1950 MB) vs Smart Split (> 1950 MB)
          if [ "$TOTAL_BYTES" -le "$SPLIT_LIMIT_BYTES" ]; then
            echo "Video size ($(( TOTAL_BYTES / 1048576 )) MB) <= 1950 MB: Preserving as ONE single full video."
            mv "$FULL_MP4" "processed_videos/${BASE_PREFIX}.mp4"
          else
            echo "Video size ($(( TOTAL_BYTES / 1048576 )) MB) > 1950 MB: Applying Smart Split into ~1.95 GB parts (-c copy)..."
            SEG_TIME=$(( (1900 * 1024 * 1024 * TOTAL_DURATION) / TOTAL_BYTES ))
            if [ "$SEG_TIME" -le 30 ]; then SEG_TIME=600; fi
            ffmpeg -hide_banner -loglevel error -y -i "$FULL_MP4" -c copy -map 0 -f segment -segment_time "$SEG_TIME" -reset_timestamps 1 "processed_videos/${BASE_PREFIX}_part%02d.mp4"
            rm -f "$FULL_MP4"
            for part in processed_videos/*part*.mp4; do
              ffmpeg -hide_banner -loglevel error -y -i "$part" -c copy -movflags +faststart "${part}.tmp" && mv "${part}.tmp" "$part"
            done
          fi

          TOTAL_BYTES=0
          shopt -s nullglob
          for f in processed_videos/*; do
            if [ -f "$f" ]; then
              TOTAL_BYTES=$((TOTAL_BYTES + $(stat -c%s "$f")))
            fi
          done

          FILE_MB=$(awk "BEGIN {printf \"%.2f\", $TOTAL_BYTES / 1048576}")
          echo "TOTAL_DURATION=$TOTAL_DURATION" >> $GITHUB_ENV
          echo "FILE_SIZE_MB=$FILE_MB" >> $GITHUB_ENV

          # Human readable duration format (e.g. 1j 27m 41d or 27m 41d)
          DUR_H=$((TOTAL_DURATION / 3600))
          DUR_M=$(( (TOTAL_DURATION % 3600) / 60 ))
          DUR_S=$((TOTAL_DURATION % 60))
          if [ "$DUR_H" -gt 0 ]; then
            HUMAN_DURATION="${DUR_H}j ${DUR_M}m ${DUR_S}d"
          else
            HUMAN_DURATION="${DUR_M}m ${DUR_S}d"
          fi
          echo "HUMAN_DURATION=$HUMAN_DURATION" >> $GITHUB_ENV

          echo "Consolidation complete: ${FILE_MB} MB total, ${TOTAL_DURATION}s (${HUMAN_DURATION}) duration."

      - name: Upload Video to Telegram (Always Guaranteed Upload via Local Bot API 2GB)
        id: upload_telegram
        if: always()
        run: |
          if [ "$HAS_VIDEO" != "true" ]; then
            echo "Skipping Telegram upload: No recorded video file exists."
            echo "TELEGRAM_LINK=" >> $GITHUB_ENV
            exit 0
          fi

          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          if [ -z "$BOT_TOKEN" ]; then
            BOT_TOKEN="8984988206:AAFdz-53vl5FHckci1tmSoxMSSBVhRwhVrY"
          fi

          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -z "$CHAT_ID" ]; then
            CHAT_ID="-1004418157265"
          fi

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or CHAT_ID missing."
            echo "TELEGRAM_LINK=" >> $GITHUB_ENV
            exit 0
          fi

          # Wait for Local Bot API server on port 8081
          echo "Connecting to Local Bot API Server on 127.0.0.1:8081..."
          for i in {1..30}; do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081 || echo "000")
            if [ "$HEALTH" = "404" ] || [ "$HEALTH" = "200" ]; then
              echo "Local Bot API Server on port 8081 is ready (HTTP $HEALTH)."
              break
            fi
            sleep 1
          done

          TELEGRAM_API_URL="http://127.0.0.1:8081/bot${BOT_TOKEN}"
          echo "Using Local Bot API Server on port 8081 (supports up to 2000MB per file): $TELEGRAM_API_URL"

          shopt -s nullglob
          VIDEO_FILES=(processed_videos/*)
          TOTAL_FILES=${#VIDEO_FILES[@]}
          echo "Total video files to upload: $TOTAL_FILES"

          LAST_MSG_LINK=""
          CURR_NUM=1

          for vid in "${VIDEO_FILES[@]}"; do
            VID_BYTES=$(stat -c%s "$vid")
            VID_MB=$(awk "BEGIN {printf \"%.2f\", $VID_BYTES / 1048576}")
            
            PART_LABEL=""
            if [ "$TOTAL_FILES" -gt 1 ]; then
              PART_LABEL=$(printf "\n📦 <b>Bagian %d/%d</b>" "$CURR_NUM" "$TOTAL_FILES")
            fi

            # Real multiline caption without %0A
            CAPTION=$(printf "🎬 <b>%s — Rekaman Live</b>\n📱 Platform: <b>%s</b>%s\n📦 Ukuran: <b>%s MB</b>\n⏱️ Durasi: <b>%s</b>\n📅 Mulai Rekam: <b>%s</b>" \
              "$MEMBER_NAME" "${PLATFORM^^}" "$PART_LABEL" "$VID_MB" "$HUMAN_DURATION" "$START_TIME_WIB")

            # 1. Probe video metadata (duration, width, height)
            VID_WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 "$vid" 2>/dev/null | tr -dc '0-9')
            VID_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 "$vid" 2>/dev/null | tr -dc '0-9')
            VID_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$vid" 2>/dev/null | cut -d'.' -f1 | tr -dc '0-9')

            if [ -z "$VID_DUR" ] || [ "$VID_DUR" -le 0 ] 2>/dev/null; then
              VID_DUR="${TOTAL_DURATION:-60}"
            fi

            # 2. Extract 1 video thumbnail frame at 3s (or 1s fallback)
            rm -f thumb.jpg
            ffmpeg -hide_banner -loglevel error -y -ss 00:00:03 -i "$vid" -frames:v 1 -q:v 2 thumb.jpg || \
            ffmpeg -hide_banner -loglevel error -y -ss 00:00:01 -i "$vid" -frames:v 1 -q:v 2 thumb.jpg || true

            # 3. Assemble curl form parameters
            EXTRA_ARGS=()
            if [ -n "$VID_WIDTH" ] && [ "$VID_WIDTH" -gt 0 ] 2>/dev/null; then
              EXTRA_ARGS+=(-F "width=${VID_WIDTH}")
            fi
            if [ -n "$VID_HEIGHT" ] && [ "$VID_HEIGHT" -gt 0 ] 2>/dev/null; then
              EXTRA_ARGS+=(-F "height=${VID_HEIGHT}")
            fi
            if [ -n "$VID_DUR" ] && [ "$VID_DUR" -gt 0 ] 2>/dev/null; then
              EXTRA_ARGS+=(-F "duration=${VID_DUR}")
            fi
            if [ -f "thumb.jpg" ] && [ -s "thumb.jpg" ]; then
              EXTRA_ARGS+=(-F "thumbnail=@thumb.jpg")
            fi

            echo "Uploading $vid (${VID_MB} MB, ${VID_DUR}s, ${VID_WIDTH}x${VID_HEIGHT}) to Telegram via Local Bot API 8081..."
            RESPONSE=$(curl -s --max-time 1800 \
              -F "chat_id=${CHAT_ID}" \
              -F "video=@${vid}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML" \
              -F "supports_streaming=true" \
              "${EXTRA_ARGS[@]}" \
              "${TELEGRAM_API_URL}/sendVideo")

            IS_OK=$(echo "$RESPONSE" | jq -r '.ok')
            if [ "$IS_OK" = "true" ]; then
              MSG_ID=$(echo "$RESPONSE" | jq -r '.result.message_id')
              if [[ "$CHAT_ID" =~ ^-100 ]]; then
                CLEAN_CHAT=$(echo "$CHAT_ID" | sed 's/^-100//')
                LAST_MSG_LINK="https://t.me/c/${CLEAN_CHAT}/${MSG_ID}"
              else
                LAST_MSG_LINK="https://t.me/${CHAT_ID}/${MSG_ID}"
              fi
              echo "Part $CURR_NUM uploaded successfully: $LAST_MSG_LINK"

              # Instant backup sync to Supabase right after upload
              SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
              if [ -z "$SUPABASE_URL" ]; then SUPABASE_URL="https://rugjqcvwlfkonziykita.supabase.co"; fi
              SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
              if [ -z "$SUPABASE_KEY" ]; then SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8"; fi

              if [ -n "$RECORDING_ID" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
                echo "Instantly syncing completed status to Supabase for ${RECORDING_ID}..."
                curl -s -X PATCH "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
                  -H "apikey: ${SUPABASE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_KEY}" \
                  -H "Content-Type: application/json" \
                  -d "{\"status\":\"completed\",\"video_url\":\"${LAST_MSG_LINK}\",\"duration_seconds\":${TOTAL_DURATION:-$VID_DUR},\"file_size_mb\":${FILE_SIZE_MB:-$VID_MB}}" || true
              fi
            else
              echo "Telegram sendVideo error: $RESPONSE"
            fi

            rm -f thumb.jpg
            CURR_NUM=$((CURR_NUM + 1))
            sleep 1
          done

          echo "TELEGRAM_LINK=$LAST_MSG_LINK" >> $GITHUB_ENV

      - name: Sync Final Status to Supabase
        if: always()
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://rugjqcvwlfkonziykita.supabase.co"
          fi

          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z2pxY3Z3bGZrb256aXlraXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQyNzUsImV4cCI6MjEwNzU2MDI3NX0.g6RFp4Ykir52EvdCpbZfZfyeoKGb5ohwLTD2YjkYNE8"
          fi

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Supabase not configured."
            exit 0
          fi

          # Only mark completed if video was captured, size is > 0, and duration is > 0
          IS_VALID_RECORDING=false
          if [ "$HAS_VIDEO" = "true" ] && [ -n "$FILE_SIZE_MB" ]; then
            IS_POSITIVE=$(awk "BEGIN {print ($FILE_SIZE_MB > 0.05) ? 1 : 0}")
            if [ "$IS_POSITIVE" -eq 1 ] && [ "${TOTAL_DURATION:-0}" -gt 0 ]; then
              IS_VALID_RECORDING=true
            fi
          fi

          if [ "$IS_VALID_RECORDING" = "true" ]; then
            echo "Marking recording as completed in Supabase (${FILE_SIZE_MB} MB, ${TOTAL_DURATION}s)..."
            FINAL_URL="${TELEGRAM_LINK:-https://t.me}"
            curl -s -X PATCH "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"completed\",\"video_url\":\"${FINAL_URL}\",\"duration_seconds\":${TOTAL_DURATION},\"file_size_mb\":${FILE_SIZE_MB}}" || true
          else
            echo "Recording is 0 MB or stream was unavailable. Deleting recording ${RECORDING_ID} from Supabase to prevent 0 MB garbage..."
            curl -s -X DELETE "${SUPABASE_URL}/rest/v1/recordings?id=eq.${RECORDING_ID}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" || true
          fi
